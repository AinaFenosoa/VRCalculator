<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Importation des polices Google Fonts : Orbitron (7-segments/Digital) et Poppins (Boutons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <title>Calculatrice VR 3D</title>
</head>
<body>
  <div class="container">
    <div class="calculatrice">
      <div id="en_tete">
        <div id="marque">
          <h3>VR-CALCULATOR</h3>
        </div>
      </div>

      <div id="ecran">
        <input id="afficheur" type="text" readonly value="" />
      </div>

      <!-- Commandes et choix du thème avec icônes SVG -->
      <div id="commandes_theme">
        <div id="on_off">
          <button title="Allumer / Éteindre la calculatrice">On/Off</button>
        </div>
        <div id="selecteur_theme">
          <button id="mode_sombre" class="bouton-theme" title="Activer le mode sombre">
            <!-- SVG Lune -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <button id="mode_clair" class="bouton-theme" title="Activer le mode clair">
            <!-- SVG Soleil -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
        </div>
      </div>

      <!-- Grille des touches -->
      <div class="boutons">
        <button id="AC" class="touche-special">AC</button>
        <button class="operateur">()</button>
        <button class="operateur">%</button>
        <button class="operateur">÷</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operateur">X</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operateur">-</button>

        <button id="un">1</button>
        <button>2</button>
        <button>3</button>
        <button class="operateur">+</button>

        <button>0</button>
        <button>,</button>
        <button id="DEL" class="touche-special">DEL</button>
        <button id="egale">=</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
