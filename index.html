<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Importation des polices Google Fonts : Orbitron (7-segments/Digital) et Poppins (Boutons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <title>Calculatrice VR 3D</title>
</head>
<body>
  <div class="container">
    <div class="calculatrice">
      <div id="en_tete">
        <div id="marque">
          <h3>VR-CALCULATOR</h3>
        </div>
      </div>

      <div id="ecran">
        <input id="afficheur" type="text" readonly value="" />
      </div>

      <!-- Commandes et choix du thème -->
      <div id="commandes_theme">
        <div id="on_off">
          <button title="Allumer / Éteindre la calculatrice" aria-label="On Off">
            <!-- SVG Symbole Power (On/Off) -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
          </button>
        </div>
        <div id="selecteur_theme">
          <button id="mode_sombre" class="bouton-theme" title="Activer le mode sombre">
            <!-- SVG Lune -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <button id="mode_clair" class="bouton-theme" title="Activer le mode clair">
            <!-- SVG Soleil -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
        </div>
      </div>

      <!-- Grille des touches avec attribut data-val pour la logique JS -->
      <div class="boutons">
        <button id="AC" class="touche-special" data-val="AC">AC</button>
        
        <button class="operateur" data-val="()">
          <!-- SVG Parentheses -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 4c-3 4-3 12 0 16M16 4c3 4 3 12 0 16"></path>
          </svg>
        </button>

        <button class="operateur" data-val="%">
          <!-- SVG Pourcentage -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="5" x2="5" y2="19"></line>
            <circle cx="6.5" cy="6.5" r="2.5"></circle>
            <circle cx="17.5" cy="17.5" r="2.5"></circle>
          </svg>
        </button>

        <button class="operateur" data-val="÷">
          <!-- SVG Division -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="6" r="1.5" fill="currentColor"></circle>
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <circle cx="12" cy="18" r="1.5" fill="currentColor"></circle>
          </svg>
        </button>

        <button data-val="7">7</button>
        <button data-val="8">8</button>
        <button data-val="9">9</button>
        
        <button class="operateur" data-val="X">
          <!-- SVG Multiplication -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <button data-val="4">4</button>
        <button data-val="5">5</button>
        <button data-val="6">6</button>

        <button class="operateur" data-val="-">
          <!-- SVG Soustraction -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>

        <button class="operateur" data-val="+">
          <!-- SVG Addition -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <button data-val="0">0</button>
        <button data-val=",">,</button>
        <button id="DEL" class="touche-special" data-val="DEL">DEL</button>

        <button id="egale" data-val="=">
          <!-- SVG Egal -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="9" x2="19" y2="9"></line>
            <line x1="5" y1="15" x2="19" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
